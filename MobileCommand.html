<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1923">
<title>Mobile Command</title>
<link rel="manifest" href="./mobile-manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1923;
  --bg2: #162029;
  --bg3: #1c2b36;
  --card: #1a2836;
  --border: rgba(255,255,255,0.08);
  --text: #e8edf2;
  --text-dim: rgba(255,255,255,0.45);
  --text-muted: rgba(255,255,255,0.3);
  --accent: #e8b931;
  --green: #34a853;
  --red: #d93025;
  --orange: #e8710a;
  --blue: #4285f4;
  --purple: #9334e6;
  --teal: #14b8a6;
  --fire: #ff6b35;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text);
  height:100vh; height:100dvh; overflow:hidden;
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ===== TOP BAR ===== */
.top-bar {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px 8px; flex-shrink:0;
}
.top-bar-left { display:flex; align-items:center; gap:10px; }
.top-bar-back {
  display:none; width:32px; height:32px; border-radius:50%;
  background:rgba(255,255,255,0.06); border:none; cursor:pointer;
  color:var(--text); font-size:18px;
  align-items:center; justify-content:center;
}
.top-bar-back.visible { display:flex; }
.top-bar-title { font-size:17px; font-weight:600; }
.top-bar-date { font-size:12px; color:var(--text-dim); }
.top-bar-sync { width:8px; height:8px; border-radius:50%; background:var(--green); flex-shrink:0; }
.top-bar-sync.offline { background:var(--red); }

/* ===== PAGES ===== */
.page { display:none; flex:1; overflow:hidden; flex-direction:column; }
.page.active { display:flex; }

/* ===== HOME SCREEN ===== */
.home-grid {
  flex:1; display:grid; grid-template-columns:1fr 1fr;
  gap:14px; padding:20px 16px; align-content:start;
}
.home-box {
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:24px 16px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px;
  cursor:pointer; transition:transform 0.15s, background 0.2s;
  min-height:140px;
}
.home-box:active { transform:scale(0.96); background:var(--bg3); }
.home-box-icon { font-size:36px; }
.home-box-label { font-size:15px; font-weight:600; text-align:center; }
.home-box-count {
  font-size:12px; color:var(--text-dim); margin-top:-4px;
}
.home-box.quickadd { border-color:var(--accent); }
.home-box.quickadd .home-box-icon { filter:drop-shadow(0 0 8px rgba(232,185,49,0.3)); }
.home-box.queue .home-box-count { color:var(--orange); font-weight:600; }

/* ===== QUICK ADD PAGE ===== */
.quick-add-area {
  flex:1; display:flex; flex-direction:column;
  padding:16px; gap:12px;
}
.quick-add-textarea {
  flex:1; background:var(--bg2); border:1px solid var(--border);
  border-radius:12px; padding:16px; color:var(--text);
  font-size:16px; font-family:inherit; resize:none; outline:none;
  min-height:120px;
}
.quick-add-textarea::placeholder { color:var(--text-muted); }
.quick-add-btns {
  display:flex; gap:10px; align-items:center; justify-content:flex-end;
}
.qa-mic-btn {
  width:48px; height:48px; border-radius:50%; border:none;
  background:rgba(255,255,255,0.06); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:var(--text-dim); font-size:22px; transition:all 0.2s;
}
.qa-mic-btn.recording { background:var(--red); color:#fff; animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
.qa-save-btn {
  flex:1; max-width:200px; background:var(--accent); color:#000; border:none;
  border-radius:12px; padding:14px 24px; font-size:16px; font-weight:700;
  cursor:pointer; font-family:inherit; transition:opacity 0.2s;
}
.qa-save-btn:active { opacity:0.8; }

/* ===== QUEUE PAGE ===== */
.queue-list { flex:1; overflow-y:auto; padding:0 0 20px; -webkit-overflow-scrolling:touch; }
.q-item {
  display:flex; align-items:center; gap:12px;
  padding:14px 16px; border-bottom:1px solid var(--border);
}
.q-complete {
  width:24px; height:24px; border-radius:50%; border:2px solid var(--text-muted);
  flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all 0.2s;
}
.q-complete:active { border-color:var(--red); background:rgba(217,48,37,0.15); }
.q-body { flex:1; min-width:0; }
.q-text { font-size:14px; line-height:1.4; }
.q-meta { font-size:11px; color:var(--text-dim); margin-top:3px; }
.q-meta-tag {
  display:inline-block; padding:1px 6px; border-radius:4px;
  background:rgba(255,255,255,0.06); margin-right:4px;
}
.q-edit {
  width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:15px; opacity:0.35; transition:opacity 0.2s;
  border-radius:8px;
}
.q-edit:active { opacity:0.8; background:rgba(255,255,255,0.06); }

/* Queue edit panel */
.q-edit-panel {
  display:none; padding:10px 16px 14px; background:var(--bg2);
  border-bottom:1px solid var(--border);
}
.q-edit-panel.open { display:block; }
.qe-input {
  width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
  background:var(--bg); color:var(--text); font-size:14px; margin-bottom:8px;
  font-family:inherit;
}
.qe-row { display:flex; gap:8px; align-items:center; }
.qe-label { font-size:12px; color:var(--text-muted); white-space:nowrap; }
.qe-select {
  flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:8px;
  background:var(--bg); color:var(--text); font-size:13px;
}
.qe-save {
  padding:8px 16px; background:var(--accent); color:#000; border:none;
  border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
}

/* Confirm delete popup */
.confirm-popup {
  position:fixed; top:0; left:0; right:0; bottom:0; z-index:100;
  background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center;
}
.confirm-box {
  background:var(--bg2); border:1px solid var(--border); border-radius:16px;
  padding:24px; max-width:300px; width:90%; text-align:center;
}
.confirm-box p { font-size:14px; margin-bottom:4px; }
.confirm-box .item-text { font-size:13px; color:var(--text-dim); margin-bottom:16px; }
.confirm-btns { display:flex; gap:10px; justify-content:center; }
.confirm-btns button {
  flex:1; padding:10px; border-radius:10px; border:none;
  font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;
}
.confirm-cancel { background:var(--bg3); color:var(--text); }
.confirm-delete { background:var(--red); color:#fff; }

/* ===== TASK PAGE ===== */
.task-summary { display:flex; gap:10px; padding:12px 16px; flex-shrink:0; }
.task-summary-card {
  flex:1; background:var(--card); border-radius:10px; padding:10px;
  text-align:center; border:1px solid var(--border);
}
.task-summary-val { font-size:22px; font-weight:700; }
.task-summary-label { font-size:10px; color:var(--text-dim); margin-top:2px; }
.task-filters {
  display:flex; gap:6px; padding:8px 16px; flex-shrink:0;
  overflow-x:auto; scrollbar-width:none;
}
.task-filters::-webkit-scrollbar { display:none; }
.filter-chip {
  flex-shrink:0; padding:6px 12px; border-radius:16px; font-size:12px;
  background:var(--bg3); color:var(--text-dim); cursor:pointer; border:1px solid var(--border);
}
.filter-chip.active { background:var(--accent); color:#000; border-color:var(--accent); }
.task-list { flex:1; overflow-y:auto; padding:0 0 20px; -webkit-overflow-scrolling:touch; }
.task-card {
  display:flex; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border);
  align-items:flex-start; transition:transform 0.3s, opacity 0.3s;
}
.task-card.completing { transform:translateX(80px); opacity:0; }
.task-check {
  width:20px; height:20px; border-radius:50%; border:2px solid var(--text-muted);
  flex-shrink:0; cursor:pointer; margin-top:2px; transition:all 0.2s;
}
.task-check.done { background:var(--green); border-color:var(--green); }
.task-body { flex:1; min-width:0; }
.task-text { font-size:14px; line-height:1.3; }
.task-text.done { text-decoration:line-through; opacity:0.4; }
.task-meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
.task-meta span { font-size:10px; padding:2px 6px; border-radius:4px; }
.task-tag { background:rgba(255,255,255,0.06); color:var(--text-dim); }
.tag-business { color:var(--blue); }
.tag-health { color:var(--green); }
.tag-finance { color:var(--accent); }
.tag-sidehustle { color:var(--purple); }
.task-pri { font-weight:600; }
.pri-p0 { color:var(--red); }
.pri-p1 { color:var(--orange); }
.pri-p2 { color:var(--text-dim); }
.pri-p3 { color:var(--text-muted); }
.task-due { color:var(--text-dim); }
.task-due.overdue { color:var(--red); font-weight:600; }
.task-score { font-weight:600; }
.task-fire { font-size:14px; flex-shrink:0; margin-top:2px; }
.dt-score { font-weight:600; }
.dt-score.defcon { color:var(--red); }
.dt-score.high { color:var(--orange); }

/* ===== WTD PAGE ===== */
.wtd-score-bar {
  padding:16px; text-align:center; flex-shrink:0;
  background:linear-gradient(180deg, var(--bg2), var(--bg));
}
.wtd-score-pct { font-size:36px; font-weight:700; }
.wtd-score-sub { font-size:12px; color:var(--text-dim); margin-top:2px; }
.wtd-progress { height:6px; background:var(--bg3); border-radius:3px; margin-top:10px; overflow:hidden; }
.wtd-progress-fill { height:100%; border-radius:3px; transition:width 0.5s; }
.wtd-list { flex:1; overflow-y:auto; padding:0 0 20px; -webkit-overflow-scrolling:touch; }
.wtd-section-label { font-size:11px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; padding:12px 16px 4px; }
.wtd-card {
  display:flex; align-items:center; gap:10px; padding:12px 16px;
  border-bottom:1px solid var(--border);
}
.wtd-check {
  width:20px; height:20px; border-radius:50%; border:2px solid var(--text-muted);
  flex-shrink:0; cursor:pointer; transition:all 0.2s;
  display:flex; align-items:center; justify-content:center;
}
.wtd-check.done { background:var(--green); border-color:var(--green); }
.wtd-check.done::after { content:'\2713'; color:#fff; font-size:11px; }
.wtd-check.na { background:var(--bg3); border-color:var(--text-muted); opacity:0.4; }
.wtd-body { flex:1; }
.wtd-text { font-size:14px; }
.wtd-text.done { text-decoration:line-through; opacity:0.4; }
.wtd-repeat { font-size:10px; color:var(--text-dim); margin-top:2px; }
.wtd-weight { font-size:10px; color:var(--text-dim); flex-shrink:0; }
.wtd-synthetic { opacity:0.85; }

/* ===== EMPTY STATE ===== */
.empty-state { text-align:center; padding:40px 20px; }
.empty-state-icon { font-size:32px; margin-bottom:8px; }
.empty-state-text { font-size:13px; color:var(--text-dim); line-height:1.5; }

/* ===== TOAST ===== */
.toast {
  position:fixed; bottom:40px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--card); color:var(--text); padding:10px 20px;
  border-radius:20px; font-size:13px; opacity:0; transition:all 0.3s;
  pointer-events:none; border:1px solid var(--border); z-index:999;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ===== TOP BAR ===== -->
<div class="top-bar">
  <div class="top-bar-left">
    <button class="top-bar-back" id="backBtn" onclick="goHome()">&#8592;</button>
    <div>
      <div class="top-bar-title" id="pageTitle">Mobile Command</div>
      <div class="top-bar-date" id="topDate"></div>
    </div>
  </div>
  <div class="top-bar-sync" id="syncIndicator"></div>
</div>

<!-- ===== PAGE: HOME ===== -->
<div class="page active" id="page-home">
  <div class="home-grid">
    <div class="home-box quickadd" onclick="goTo('quickadd')">
      <div class="home-box-icon">&#9889;</div>
      <div class="home-box-label">Quick Add</div>
      <div class="home-box-count">Capture anything</div>
    </div>
    <div class="home-box queue" onclick="goTo('queue')">
      <div class="home-box-icon">&#128229;</div>
      <div class="home-box-label">Queue</div>
      <div class="home-box-count" id="homeQueueCount">0 items</div>
    </div>
    <div class="home-box" onclick="goTo('tasks')">
      <div class="home-box-icon">&#9745;</div>
      <div class="home-box-label">Tasks</div>
      <div class="home-box-count" id="homeTaskCount">0 open</div>
    </div>
    <div class="home-box" onclick="goTo('wtd')">
      <div class="home-box-icon">&#127942;</div>
      <div class="home-box-label">Win The Day</div>
      <div class="home-box-count" id="homeWtdScore">0%</div>
    </div>
  </div>
</div>

<!-- ===== PAGE: QUICK ADD ===== -->
<div class="page" id="page-quickadd">
  <div class="quick-add-area">
    <textarea class="quick-add-textarea" id="qaInput" placeholder="What's on your mind? Task, idea, grocery item, anything..." rows="5"></textarea>
    <div class="quick-add-btns">
      <button class="qa-mic-btn" id="qaMicBtn" onclick="startVoice()">&#127908;</button>
      <button class="qa-save-btn" onclick="quickAdd()">Save</button>
    </div>
  </div>
</div>

<!-- ===== PAGE: QUEUE ===== -->
<div class="page" id="page-queue">
  <div class="queue-list" id="queueList"></div>
</div>

<!-- ===== PAGE: TASKS ===== -->
<div class="page" id="page-tasks">
  <div class="task-summary">
    <div class="task-summary-card"><div class="task-summary-val" id="taskOpenCount">0</div><div class="task-summary-label">Open</div></div>
    <div class="task-summary-card"><div class="task-summary-val" id="taskDoneCount" style="color:var(--green)">0</div><div class="task-summary-label">Done Today</div></div>
    <div class="task-summary-card"><div class="task-summary-val" id="taskOverdueCount" style="color:var(--red)">0</div><div class="task-summary-label">Overdue</div></div>
  </div>
  <div class="task-filters" id="taskFilterBar">
    <div class="filter-chip active" data-filter="all" onclick="setTaskFilter('all')">All</div>
    <div class="filter-chip" data-filter="highpri" onclick="setTaskFilter('highpri')">High Pri</div>
    <div class="filter-chip" data-filter="today" onclick="setTaskFilter('today')">Today</div>
    <div class="filter-chip" data-filter="overdue" onclick="setTaskFilter('overdue')">Overdue</div>
    <div class="filter-chip" data-filter="done" onclick="setTaskFilter('done')">Done</div>
    <div class="filter-chip" data-filter="business" onclick="setTaskFilter('business')">Business</div>
    <div class="filter-chip" data-filter="personal" onclick="setTaskFilter('personal')">Personal</div>
    <div class="filter-chip" data-filter="health" onclick="setTaskFilter('health')">Health</div>
    <div class="filter-chip" data-filter="finance" onclick="setTaskFilter('finance')">Finance</div>
  </div>
  <div class="task-list" id="taskList"></div>
</div>

<!-- ===== PAGE: WTD ===== -->
<div class="page" id="page-wtd">
  <div class="wtd-score-bar">
    <div class="wtd-score-pct" id="wtdScorePct">0%</div>
    <div class="wtd-score-sub"><span id="wtdDoneCount">0/0</span> completed</div>
    <div class="wtd-progress"><div class="wtd-progress-fill" id="wtdProgressFill"></div></div>
  </div>
  <div class="wtd-list" id="wtdList"></div>
</div>

<!-- ===== CONFIRM POPUP (hidden) ===== -->
<div class="confirm-popup" id="confirmPopup" style="display:none" onclick="closeConfirm(event)">
  <div class="confirm-box" onclick="event.stopPropagation()">
    <p>Remove this item?</p>
    <div class="item-text" id="confirmText"></div>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-delete" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<!-- ===== FIREBASE ===== -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
// ===== FIREBASE INIT =====
firebase.initializeApp({
  apiKey: "AIzaSyCjpcXsrxvoi70MUFVATOKREukEI3tbuOQ",
  authDomain: "command-center-1370d.firebaseapp.com",
  databaseURL: "https://command-center-1370d-default-rtdb.firebaseio.com",
  projectId: "command-center-1370d",
  storageBucket: "command-center-1370d.firebasestorage.app",
  messagingSenderId: "284252023636",
  appId: "1:284252023636:web:c7d6a5c213ffd7761836c1"
});
const dbRef = firebase.database();

// ===== DATA LAYER =====
const _now = new Date();
const TODAY = _now.getFullYear() + '-' + String(_now.getMonth()+1).padStart(2,'0') + '-' + String(_now.getDate()).padStart(2,'0');

function getData(key, fallback) {
  try {
    const val = JSON.parse(localStorage.getItem(key));
    return val !== null && val !== undefined ? val : fallback;
  } catch { return fallback; }
}
function toFirebaseKey(k) { return k.replace(/\./g, '~'); }
function fromFirebaseKey(k) { return k.replace(/~/g, '.'); }

let _lastLocalWrite = 0;
function setData(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
  _lastLocalWrite = Date.now();
  dbRef.ref('data/' + toFirebaseKey(key)).set(val);
}

// ===== REAL-TIME SYNC =====
let firebaseLoaded = false;
const syncEl = document.getElementById('syncIndicator');

dbRef.ref('data').on('value', snap => {
  if (Date.now() - _lastLocalWrite < 2000) return;
  const allData = snap.val();
  if (allData) {
    let changed = false;
    Object.keys(allData).forEach(k => {
      const localKey = fromFirebaseKey(k);
      const fbVal = JSON.stringify(allData[k]);
      const localVal = localStorage.getItem(localKey);
      if (fbVal !== localVal) { localStorage.setItem(localKey, fbVal); changed = true; }
    });
    if (changed || !firebaseLoaded) { firebaseLoaded = true; reloadData(); }
  }
  if (syncEl) syncEl.className = 'top-bar-sync';
});
dbRef.ref('.info/connected').on('value', snap => {
  if (syncEl) syncEl.className = snap.val() ? 'top-bar-sync' : 'top-bar-sync offline';
});

// ===== CORE DATA =====
let tasks = getData('allTasks', []);
let wtdItems = getData('wtdItems', []);
let wtdChecks = getData('wtdChecks', {});
let pmProjects = getData('pmProjects', []);
let winsJournal = getData('winsJournal', []);
let captureQueue = getData('captureQueue', []);

function reloadData() {
  tasks = getData('allTasks', []);
  wtdItems = getData('wtdItems', []);
  wtdChecks = getData('wtdChecks', {});
  pmProjects = getData('pmProjects', []);
  winsJournal = getData('winsJournal', []);
  captureQueue = getData('captureQueue', []);
  renderAll();
}

// ===== DATE DISPLAY =====
(function() {
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const d = new Date();
  document.getElementById('topDate').textContent = days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate();
})();

// ===== NAVIGATION =====
let currentPage = 'home';
const pageTitles = { home:'Mobile Command', quickadd:'Quick Add', queue:'Queue', tasks:'Tasks', wtd:'Win The Day' };

function goTo(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('pageTitle').textContent = pageTitles[page] || 'Mobile Command';
  document.getElementById('backBtn').classList.toggle('visible', page !== 'home');
  if (page === 'quickadd') { setTimeout(() => document.getElementById('qaInput').focus(), 100); }
  else if (page === 'queue') renderQueue();
  else if (page === 'tasks') renderTasks();
  else if (page === 'wtd') renderWtd();
  else if (page === 'home') updateHomeCounts();
}

function goHome() { goTo('home'); }

// ===== HOME COUNTS =====
function updateHomeCounts() {
  const qCount = captureQueue.filter(i => !i.done).length;
  document.getElementById('homeQueueCount').textContent = qCount + ' item' + (qCount !== 1 ? 's' : '');
  const tOpen = tasks.filter(t => !t.done).length;
  document.getElementById('homeTaskCount').textContent = tOpen + ' open';
  const score = getWtdScore();
  document.getElementById('homeWtdScore').textContent = score.pct + '%';
}

// ===== QUICK ADD =====
function quickAdd() {
  const input = document.getElementById('qaInput');
  const text = input.value.trim();
  if (!text) return;
  // Support multiple lines — each line becomes a separate item
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  lines.forEach(line => {
    captureQueue.push({

    });

}

let recognition = null;
function startVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { showToast('Voice not supported'); return; }
  const btn = document.getElementById('qaMicBtn');
  if (recognition) { recognition.stop(); return; }
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  btn.classList.add('recording');
  recognition.onresult = function(e) {
    let transcript = '';
    for (let i = 0; i < e.results.length; i++) transcript += e.results[i][0].transcript;
    document.getElementById('qaInput').value = transcript;
  };
  recognition.onend = function() { btn.classList.remove('recording'); recognition = null; };
  recognition.onerror = function() { btn.classList.remove('recording'); recognition = null; showToast('Voice error'); };
  recognition.start();
}

// ===== TASK SCORING (mirrors CRM) =====
function scoreTask(t) {
  if (t.done) return 0;
  let score = 0;
  const priPoints = {p0: 55, p1: 40, p2: 25, p3: 10};
  score += priPoints[t.priority] || 15;
  if (t.due) {
    const daysUntil = Math.ceil((new Date(t.due+'T12:00:00') - new Date(TODAY+'T12:00:00')) / 86400000);
    const hardMultiplier = t.hardDeadline ? 1.5 : 1;
    let urgency = 0;
    if (daysUntil < 0) urgency = Math.min(35, 25 + (Math.abs(daysUntil) * 2));
    else if (daysUntil === 0) urgency = 25;
    else if (daysUntil <= 2) urgency = 18;
    else if (daysUntil <= 7) urgency = 10;
    else urgency = 3;
    score += Math.min(45, Math.round(urgency * hardMultiplier));
  }
  if (t.created) {
    const age = Math.max(0, Math.ceil((new Date(TODAY+'T12:00:00') - new Date(t.created+'T12:00:00')) / 86400000));
    score += age;
  }
  if (t.project) {
    const siblings = tasks.filter(s => s.project === t.project && !s.done && s.id !== t.id);
    if (siblings.some(s => s.due && s.due < TODAY)) score += 7;
    else if (siblings.some(s => s.priority === 'p0' || s.priority === 'p1')) score += 4;
  }
  if (t.isFrog) score += 20;
  else if (t.is8020) score += 12;
  if (t.blueprintRef) score += 10;
  return Math.min(100, score);
}
function getScoreLabel(score) {
  if (score >= 75) return 'defcon';
  if (score >= 50) return 'high';
  return '';
}

// ===== TASK FILTER & RENDER =====
let taskFilter = 'all';
function setTaskFilter(f) {
  taskFilter = f;
  document.querySelectorAll('#taskFilterBar .filter-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.filter === f);
  });
  renderTasks();
}

function renderTasks() {
  const list = document.getElementById('taskList');
  let filtered = tasks.slice();
  if (taskFilter === 'highpri') filtered = filtered.filter(t => !t.done && (t.priority === 'p0' || t.priority === 'p1'));
  else if (taskFilter === 'today') filtered = filtered.filter(t => !t.done && t.due === TODAY);
  else if (taskFilter === 'overdue') filtered = filtered.filter(t => !t.done && t.due && t.due < TODAY);
  else if (taskFilter === 'done') filtered = filtered.filter(t => t.done);
  else if (['personal','business','health','finance','sidehustle'].includes(taskFilter)) filtered = filtered.filter(t => !t.done && t.tag === taskFilter);
  else filtered = filtered.filter(t => !t.done);
  filtered.sort((a, b) => scoreTask(b) - scoreTask(a));

  const open = tasks.filter(t => !t.done);
  const doneToday = tasks.filter(t => t.done && t.completed === TODAY);
  const overdue = tasks.filter(t => !t.done && t.due && t.due < TODAY);
  document.getElementById('taskOpenCount').textContent = open.length;
  document.getElementById('taskDoneCount').textContent = doneToday.length;
  document.getElementById('taskOverdueCount').textContent = overdue.length;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' +
      (taskFilter === 'done' ? '&#127881;' : '&#9989;') + '</div><div class="empty-state-text">' +
      (taskFilter === 'done' ? 'No completed tasks today yet.' : 'No tasks match this filter.') +
      '</div></div>';
    return;
  }

  let html = '';
  filtered.forEach(t => {
    const score = scoreTask(t);
    const scoreClass = getScoreLabel(score);
    const priLabels = {p0:'CRIT', p1:'P1', p2:'P2', p3:'P3'};
    const isOverdue = t.due && t.due < TODAY && !t.done;
    html += '<div class="task-card" id="task_' + t.id + '">';
    html += '<div class="task-check' + (t.done ? ' done' : '') + '" onclick="toggleTask(' + t.id + ')"></div>';
    if (t.priority === 'p0' && !t.done) html += '<div class="task-fire">&#128293;</div>';
    html += '<div class="task-body">';
    html += '<div class="task-text' + (t.done ? ' done' : '') + '">' + esc(t.text) + '</div>';
    html += '<div class="task-meta">';
    html += '<span class="task-tag tag-' + (t.tag || 'personal') + '">' + (t.tag || 'personal') + '</span>';
    html += '<span class="task-pri pri-' + (t.priority || 'p2') + '">' + (priLabels[t.priority] || 'P2') + '</span>';
    if (t.due) html += '<span class="task-due' + (isOverdue ? ' overdue' : '') + '">' + (isOverdue ? '&#9888; ' : '') + formatDate(t.due) + '</span>';
    if (t.project) html += '<span class="task-tag">&#128203; ' + esc(t.project) + '</span>';
    if (!t.done) html += '<span class="dt-score ' + scoreClass + '">' + score + 'pts</span>';
    html += '</div></div></div>';
  });
  list.innerHTML = html;
}

// ===== TOGGLE TASK =====
function toggleTask(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  t.done = !t.done;
  t.completed = t.done ? TODAY : '';
  const el = document.getElementById('task_' + id);
  if (el && t.done) {
    el.classList.add('completing');
    setTimeout(() => { renderTasks(); }, 350);
  } else { renderTasks(); }
  if (t.done) {
    addWin(t.text, 'task', t.tag);
    showToast('✓ ' + t.text.slice(0, 30) + (t.text.length > 30 ? '...' : ''));
  }
  syncCompletionToProject(t, t.done);
  setData('allTasks', tasks);
}

function syncCompletionToProject(taskObj, isDone) {
  if (!taskObj.project) return;
  const proj = pmProjects.find(p => p.name.toLowerCase() === taskObj.project.toLowerCase());
  if (!proj) return;
  const syncId = 'sync_' + taskObj.id;
  const pmTask = (proj.tasks || []).find(t => t.syncId === syncId);
  if (pmTask) { pmTask.done = isDone; proj.lastTouched = TODAY; setData('pmProjects', pmProjects); }
}

function addWin(text, type, tag) {
  winsJournal.push({ id: Date.now(), text: text, type: type || 'task', tag: tag || '', date: TODAY, time: new Date().toTimeString().slice(0,5) });
  setData('winsJournal', winsJournal);
}

// ===== WTD LOGIC (mirrors CRM) =====
function isWtdItemDueOnDate(item, dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const dow = d.getDay(); const dom = d.getDate(); const r = item.repeat;
  if (!item.active) return false;
  if (r.type === 'daily') return true;
  if (r.type === 'weekdays') return dow >= 1 && dow <= 5;
  if (r.type === 'weekends') return dow === 0 || dow === 6;
  if (r.type === 'custom') return (r.days || []).includes(dow);
  if (r.type === 'monthly') return dom === r.monthDay;
  if (r.type === 'anytime_weekly') return true;
  if (r.type === 'anytime_monthly') return true;
  return true;
}
function isItemActiveOnDate(item, dateStr) {
  const created = item.createdDate || '2026-04-13';
  if (dateStr < created) return false;
  if (item.archived && item.archivedDate && dateStr >= item.archivedDate) return false;
  return true;
}
function getItemWeight(item) { return item.weight || 3; }
function isAnytimeItem(item) { return item.repeat.type === 'anytime_weekly' || item.repeat.type === 'anytime_monthly'; }

function getAnytimePeriod(item, dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  if (item.repeat.type === 'anytime_weekly') {
    const dow = d.getDay();
    const mondayOffset = dow === 0 ? -6 : 1 - dow;
    const monday = new Date(d); monday.setDate(d.getDate() + mondayOffset);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    return { start: monday.toISOString().split('T')[0], end: sunday.toISOString().split('T')[0] };
  }
  if (item.repeat.type === 'anytime_monthly') {
    const year = d.getFullYear(), month = d.getMonth();
    return { start: new Date(year, month, 1).toISOString().split('T')[0], end: new Date(year, month + 1, 0).toISOString().split('T')[0] };
  }
  return null;
}
function findAnytimeCompletionDate(item, period) {
  const start = new Date(period.start + 'T12:00:00');
  const end = new Date(period.end + 'T12:00:00');
  const now = new Date(TODAY + 'T12:00:00');
  const limit = end < now ? end : now;
  for (let d = new Date(start); d <= limit; d.setDate(d.getDate() + 1)) {
    const ds = d.toISOString().split('T')[0];
    if (wtdChecks[ds] && wtdChecks[ds][item.id] === true) return ds;
  }
  return null;
}
function shouldAnytimeCountForScoring(item, dateStr) {
  const period = getAnytimePeriod(item, dateStr);
  if (!period) return false;
  const completionDate = findAnytimeCompletionDate(item, period);
  if (completionDate === dateStr) return true;
  if (dateStr === period.end && !completionDate) return true;
  return false;
}

function getRepeatLabel(r) {
  if (r.type === 'daily') return 'Every day';
  if (r.type === 'weekdays') return 'Mon–Fri';
  if (r.type === 'weekends') return 'Weekends';
  if (r.type === 'custom') { const dn = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']; return (r.days || []).map(d => dn[d]).join(', '); }
  if (r.type === 'monthly') return 'Monthly (day ' + r.monthDay + ')';
  if (r.type === 'anytime_weekly') return 'Any time (weekly)';
  if (r.type === 'anytime_monthly') return 'Any time (monthly)';
  return '';
}

const SYNTHETIC_ITEMS = [
  { id: '_grat', text: 'Daily Gratitude', weight: 3, repeat: { type: 'daily' }, active: true, synthetic: true },
  { id: '_frog', text: 'Eat the Frog', weight: 5, repeat: { type: 'daily' }, active: true, synthetic: true },
  { id: '_8020', text: '80/20 (3+ done)', weight: 4, repeat: { type: 'daily' }, active: true, synthetic: true }
];

function getTodayWtdItems() {
  const results = [];
  wtdItems.forEach(item => {
    if (!item.active || item.archived) return;
    if (!isItemActiveOnDate(item, TODAY)) return;
    if (!isWtdItemDueOnDate(item, TODAY)) return;
    results.push(item);
  });
  return results;
}

function applyWtdDisplayOrder(items) {
  const order = getData('wtdDisplayOrder', []);
  if (!order.length) return items;
  const map = {}; items.forEach(i => map[i.id] = i);
  const ordered = [];
  order.forEach(id => { if (map[id]) { ordered.push(map[id]); delete map[id]; } });
  Object.values(map).forEach(i => ordered.push(i));
  return ordered;
}

let wtdShowCompleted = false;
function toggleWtdShowCompleted() { wtdShowCompleted = !wtdShowCompleted; renderWtd(); }

function getWtdScore() {
  const allItems = [...getTodayWtdItems(), ...SYNTHETIC_ITEMS];
  const checks = wtdChecks[TODAY] || {};
  const scoring = allItems.filter(i => {
    if (checks[i.id] === 'na') return false;
    if (isAnytimeItem(i)) return shouldAnytimeCountForScoring(i, TODAY);
    return true;
  });
  if (scoring.length === 0 && allItems.length > 0) {
    const regularItems = allItems.filter(i => !isAnytimeItem(i) && checks[i.id] !== 'na');
    if (regularItems.length === 0) return { pct: 0, done: 0, total: 0 };
    const tw = regularItems.reduce((s, i) => s + getItemWeight(i), 0);
    const dw = regularItems.filter(i => checks[i.id] === true).reduce((s, i) => s + getItemWeight(i), 0);
    const dc = regularItems.filter(i => checks[i.id] === true).length;
    return { pct: Math.round((dw / tw) * 100), done: dc, total: regularItems.length };
  }
  if (scoring.length === 0) return { pct: 0, done: 0, total: 0 };
  const totalWeight = scoring.reduce((s, i) => s + getItemWeight(i), 0);
  const doneWeight = scoring.filter(i => {
    if (isAnytimeItem(i)) { const period = getAnytimePeriod(i, TODAY); return period ? !!findAnytimeCompletionDate(i, period) : false; }
    return checks[i.id] === true;
  }).reduce((s, i) => s + getItemWeight(i), 0);
  const doneCount = scoring.filter(i => {
    if (isAnytimeItem(i)) { const period = getAnytimePeriod(i, TODAY); return period ? !!findAnytimeCompletionDate(i, period) : false; }
    return checks[i.id] === true;
  }).length;
  return { pct: Math.round((doneWeight / totalWeight) * 100), done: doneCount, total: scoring.length };
}

function renderWtd() {
  const list = document.getElementById('wtdList');
  const rawItems = getTodayWtdItems();
  const todayItems = applyWtdDisplayOrder(rawItems);
  const checks = wtdChecks[TODAY] || {};
  const score = getWtdScore();

  document.getElementById('wtdScorePct').textContent = score.pct + '%';
  document.getElementById('wtdDoneCount').textContent = score.done + '/' + score.total;
  const fill = document.getElementById('wtdProgressFill');
  fill.style.width = score.pct + '%';
  fill.style.background = score.pct >= 80 ? 'var(--green)' : score.pct >= 50 ? 'var(--accent)' : 'var(--red)';

  let html = '';
  let completedCount = 0;

  if (todayItems.length > 0) {
    html += '<div class="wtd-section-label">Your Items</div>';
    todayItems.forEach(item => {
      let isDone = checks[item.id] === true;
      const isNA = checks[item.id] === 'na';
      let atDoneTag = '';
      if (isAnytimeItem(item) && !isDone && !isNA) {
        const period = getAnytimePeriod(item, TODAY);
        if (period) { const compDate = findAnytimeCompletionDate(item, period); if (compDate) { isDone = true; atDoneTag = ' (done ' + formatDate(compDate) + ')'; } }
      }
      if (isDone) completedCount++;
      if (isDone && !wtdShowCompleted) return;
      const checkClass = isDone ? ' done' : (isNA ? ' na' : '');
      html += '<div class="wtd-card">';
      html += '<div class="wtd-check' + checkClass + '" onclick="toggleWtdCheck(' + item.id + ')"></div>';
      html += '<div class="wtd-body"><div class="wtd-text' + (isDone ? ' done' : '') + '">' + esc(item.text) + atDoneTag + '</div>';
      html += '<div class="wtd-repeat">' + getRepeatLabel(item.repeat) + '</div></div>';
      html += '<div class="wtd-weight">Lvl ' + getItemWeight(item) + '</div></div>';
    });
  }

  html += '<div class="wtd-section-label">Auto-Tracked</div>';
  SYNTHETIC_ITEMS.forEach(item => {
    const isDone = checks[item.id] === true;
    if (isDone) completedCount++;
    if (isDone && !wtdShowCompleted) return;
    const checkClass = isDone ? ' done' : '';
    html += '<div class="wtd-card wtd-synthetic">';
    html += '<div class="wtd-check' + checkClass + '" onclick="toggleWtdCheck(\'' + item.id + '\')"></div>';
    html += '<div class="wtd-body"><div class="wtd-text' + (isDone ? ' done' : '') + '">' + esc(item.text) + '</div>';
    html += '<div class="wtd-repeat">' + getRepeatLabel(item.repeat) + '</div></div>';
    html += '<div class="wtd-weight">Lvl ' + getItemWeight(item) + '</div></div>';
  });

  if (completedCount > 0) {
    html += '<div style="text-align:center;padding:12px 0"><span onclick="toggleWtdShowCompleted()" style="color:var(--accent);font-size:12px;cursor:pointer;opacity:0.7">';
    html += wtdShowCompleted ? '▲ Hide completed (' + completedCount + ')' : '▼ Show completed (' + completedCount + ')';
    html += '</span></div>';
  }

  list.innerHTML = html;
}

function toggleWtdCheck(itemId) {
  const id = typeof itemId === 'string' ? itemId : parseInt(itemId);
  if (!wtdChecks[TODAY]) wtdChecks[TODAY] = {};
  const current = wtdChecks[TODAY][id];
  if (current === 'na') return;
  const item = wtdItems.find(i => i.id === id) || SYNTHETIC_ITEMS.find(i => i.id === id);
  if (item && isAnytimeItem(item)) {
    const period = getAnytimePeriod(item, TODAY);
    if (period) { const compDate = findAnytimeCompletionDate(item, period); if (compDate && compDate !== TODAY) { showToast('Already done on ' + formatDate(compDate)); return; } }
  }
  wtdChecks[TODAY][id] = !current;
  setData('wtdChecks', wtdChecks);
  renderWtd();
  if (wtdChecks[TODAY][id] && item) showToast('✓ ' + item.text);
}

// ===== UTILITY =====
function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatDate(dateStr) {
  if (!dateStr) return '';
  if (dateStr === TODAY) return 'Today';
  const d = new Date(dateStr + 'T12:00:00');
  const diff = Math.ceil((d - new Date(TODAY+'T12:00:00')) / 86400000);
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getMonth()] + ' ' + d.getDate();
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ===== RENDER ALL =====
function renderAll() { updateHomeCounts(); if (currentPage === 'queue') renderQueue(); if (currentPage === 'tasks') renderTasks(); if (currentPage === 'wtd') renderWtd(); }
renderAll();
